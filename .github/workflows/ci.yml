name: reproducibility-checks
on:
  pull_request:
  push:
    branches: ['research/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Verify the checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['EXPECTED_SHA']"
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m nplam.cli run --config configs/smoke.yaml --output runs/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: runs/ci-smoke
