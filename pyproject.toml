[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nplam-reproduction"
version = "0.1.0"
description = "Independent, audited PyTorch reproduction of NPLAM"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "pandas>=2.2", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nplam = "nplam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
